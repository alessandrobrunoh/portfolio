services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: alessandrobrunoh/portfolio:latest
    container_name: portfolio
    # Host port is overridable so this can sit behind a reverse proxy: PORT=3000 docker compose up
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
