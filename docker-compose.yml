services:
  portfolio:
    image: ghcr.io/alessandrobrunoh/portfolio:${IMAGE_TAG:-latest}
    container_name: portfolio
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.portfolio.rule=Host(`alessandrobrunoh.it`) || Host(`www.alessandrobrunoh.it`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls=true
      - traefik.http.routers.portfolio.tls.certresolver=le
      - traefik.http.services.portfolio.loadbalancer.server.port=8080

networks:
  proxy:
    external: true
