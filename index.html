<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alessandro Bruno — Systems &amp; Product Engineer</title>
    <meta
      name="description"

    />
    <meta name="author" content="Alessandro Bruno" />
    <link rel="canonical" href="https://alessandrobrunoh.it/" />

    <!-- Link previews: without these, sharing the site anywhere shows a blank card. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Alessandro Bruno" />
    <meta property="og:title" content="Alessandro Bruno — Systems &amp; Product Engineer" />
    <meta
      property="og:description"
      content="Event-driven services in Rust, developer tooling, and open source. Open to backend and systems roles."
    />
    <meta property="og:url" content="https://alessandrobrunoh.it/" />
    <meta property="og:image" content="https://alessandrobrunoh.it/og.jpg" />
    <meta property="og:image:alt" content="Alessandro Bruno — Systems &amp; Product Engineer" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="it_IT" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alessandro Bruno — Systems &amp; Product Engineer" />
    <meta
      name="twitter:description"
      content="Event-driven services in Rust, developer tooling, and open source. Open to backend and systems roles."
    />
    <meta name="twitter:image" content="https://alessandrobrunoh.it/og.jpg" />

    <meta name="theme-color" content="#eceef4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Helps search engines connect the name to the profiles and the employer. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alessandro Bruno",
        "url": "https://alessandrobrunoh.it/",
        "image": "https://alessandrobrunoh.it/avatar.jpg",
        "email": "mailto:alessandro.brunoh@gmail.com",
        "jobTitle": "Systems & Product Engineer",
        "worksFor": { "@type": "Organization", "name": "Luna S.r.l.", "url": "https://lunapartner.it" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "University of Bologna" },
        "address": { "@type": "PostalAddress", "addressCountry": "IT" },
        "knowsLanguage": ["it", "en"],
        "knowsAbout": ["Rust", "Distributed systems", "Event-driven architecture", "Angular", "Spring Boot", "Observability"],
        "sameAs": ["https://github.com/alessandrobrunoh"]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&display=swap"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("theme");
          var dark;
          if (pref === "dark") dark = true;
          else if (pref === "light") dark = false;
          else {
            var hour = new Date().getUTCHours();
            dark = !(hour >= 6 && hour < 20);
          }
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
