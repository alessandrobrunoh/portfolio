    <!-- Helps search engines connect the name to the profiles and the employer. -->

      {
        "@context": "https://schema.org",

        "name": "Alessandro Bruno",
        "url": "https://alessandrobrunoh.it/",

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint; the system sans stands in for a moment. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&amp;display=swap" /></noscript>
    <link rel="preload" as="image" href="/brand/ab-monogram.webp" type="image/webp" fetchpriority="high" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("theme");
          var dark;
          if (pref === "dark") dark = true;
          else if (pref === "light") dark = false;
          else {
            var hour = new Date().getUTCHours();
            dark = !(hour >= 6 && hour < 20);
          }
          if (dark) {
            document.documentElement.classList.add("dark");
            // White mark in the tab while the site is dark (theme.ts keeps it in sync after load).
            document.querySelector('link[rel="icon"][type="image/svg+xml"]').href = "/favicon-dark.svg";
            document.querySelector('link[rel="icon"][type="image/png"]').href = "/favicon-dark-32.png";
          }
        } catch (e) {}
      })();
    </script>

  </body>
