server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Text assets are worth compressing; images and fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /etc/nginx/snippets/security.conf;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    # Set Cache-Control directly rather than via `expires`, which would emit a
    # second, conflicting Cache-Control header.
    location /assets/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # index.html must never be cached, or a deploy leaves clients on stale bundles.
    # The SPA fallback below re-enters location matching, so this covers "/" too.
    location = /index.html {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Prerendered pages live at /<route>/index.html. Like index.html they must be
    # revalidated on every visit; other files here (avatar, CV) just revalidate by ETag.
    # Anything else falls back to the app shell and is routed in the browser.
    location / {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/index.html /index.html;
    }

    location = /health {
        include /etc/nginx/snippets/security.conf;
        access_log off;
        add_header Content-Type text/plain always;
        return 200 'ok\n';
    }
}
