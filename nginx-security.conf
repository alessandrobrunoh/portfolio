# Included in every location that declares its own add_header: nginx replaces
# inherited add_header directives instead of merging them, so a block that sets
# one header silently drops all the server-level ones.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
